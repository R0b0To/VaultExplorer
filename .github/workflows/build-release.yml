name: Build & Release

on:
  push:
    tags:
      - 'v*'           # triggers on version tags like v1.0.0
  workflow_dispatch:   # allows manual runs from the Actions tab

jobs:
  build:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to read the git commit history

              # ── Set SOURCE_DATE_EPOCH to match F-Droid ────────────────────────────
      - name: Set SOURCE_DATE_EPOCH for Reproducible Builds
        run: |
          COMMIT_TIMESTAMP=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP" >> $GITHUB_ENV

      # ── Java ──────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter (PINNED VERSION for Reproducible Builds) ─────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'  # Pinned exact version for F-Droid reproducibility
          cache: true

      # ── Node.js (PINNED VERSION for pdf.js build) ────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install dependencies
        run: flutter pub get

      # ── Keystore ────────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      # ── Build APKs (GitHub Releases / F-Droid direct install) ───────────────
      - name: Build release APKs (Split per ABI)
        run: flutter build apk --release --split-per-abi

      # ── Build AAB (Play Store) ─────────────────────────────────────────────
      - name: Build release App Bundle (Play Store)
        run: flutter build appbundle --release

      # ── Rename with version ───────────────────────────────────────────
      - name: Rename build outputs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          mkdir -p release-apks
          mkdir -p release-aab

          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            filename=$(basename "$apk" .apk)
            abi=$(echo "$filename" | sed 's/^app-//' | sed 's/-release$//')
            cp "$apk" "release-apks/vaultexplorer-${VERSION}-${abi}.apk"
          done

          cp build/app/outputs/bundle/release/app-release.aab "release-aab/vaultexplorer-${VERSION}.aab"

      # ── Upload artifacts ───────────────────────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaultExplorer-${{ env.APP_VERSION }}-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultExplorer-${{ env.APP_VERSION }}-AAB
          path: release-aab/*.aab
          retention-days: 30

      # ── Create GitHub Release ───────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VaultExplorer ${{ github.ref_name }}
          files: release-apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Cleanup keystore ────────────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/key.properties