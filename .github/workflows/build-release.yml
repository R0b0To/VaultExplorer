name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [arm64, armeabi, x64]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android NDK r28c
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Build release APK (${{ matrix.flavor }})
        run: bash ./scripts/reproducible_build.sh "${{ matrix.flavor }}"

      - name: Rename build output
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | cut -d'+' -f1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p release-apk
          cp "build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk" \
             "release-apk/VaultExplorer-v${VERSION}-${{ matrix.flavor }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultExplorer-${{ matrix.flavor }}-APK
          path: release-apk/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Build Number & Set Changelog Path
        run: |
          # Extracts build number from pubspec.yaml (e.g., 'version: 1.5.0+8' -> '8')
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | cut -d'+' -f2)
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${BUILD_NUMBER}.txt"

          if [ -f "$CHANGELOG_FILE" ]; then
            echo "Found custom changelog at $CHANGELOG_FILE"
            echo "CHANGELOG_PATH=$CHANGELOG_FILE" >> $GITHUB_ENV
          else
            echo "No custom changelog found for build $BUILD_NUMBER, relying on auto-generated notes."
            echo "CHANGELOG_PATH=" >> $GITHUB_ENV
          fi

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-apk
          pattern: VaultExplorer-*-APK
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VaultExplorer ${{ github.ref_name }}
          files: release-apk/*.apk
          body_path: ${{ env.CHANGELOG_PATH }}
          generate_release_notes: true # Appends commit notes if no body_path is found
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove keystore
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/key.properties