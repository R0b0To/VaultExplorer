name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUB_CACHE: /tmp/.pub-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set SOURCE_DATE_EPOCH for Reproducible Builds
        run: |
          COMMIT_TIMESTAMP=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP" >> $GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Install Android NDK r28d (28.2.13676358) ───────────────────────
      - name: Install Android NDK r28d
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: flutter pub get

      # NOTE: the `jni` pub package's build-id/file-prefix reproducibility
      # patch is no longer applied here as a separate step -- it's now
      # configured directly in android/app/build.gradle.kts via
      # `rootProject.subprojects { ... }`, so it runs automatically as part
      # of Gradle's own configuration phase during "Build release APK"
      # below. See that file for details. scripts/patch_jni_reproducibility.sh
      # is no longer invoked by this workflow.

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Pin to single CPU core for R8 determinism
        run: echo "TASKSET=taskset -c 0" >> $GITHUB_ENV

      - name: Build release APK
        run: ${TASKSET:-} flutter build apk --release

      - name: Verify no build-id in native libs
        run: |
          mkdir -p /tmp/verify
          unzip -q build/app/outputs/flutter-apk/app-release.apk -d /tmp/verify
          fail=0
          for so in /tmp/verify/lib/*/libdartjni.so; do
            if readelf -W -S "$so" | grep -q '\.note\.gnu\.build-id'; then
              echo "::error::$so still has .note.gnu.build-id -- reproducibility patch didn't apply"
              fail=1
            else
              echo "✅ OK: $so is clean (no build-id found)"
            fi
          done
          exit $fail

      - name: Rename build output
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          SHA=$(git rev-parse --short HEAD)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p release-apk
          cp build/app/outputs/flutter-apk/app-release.apk "release-apk/vaultexplorer-${VERSION}-${SHA}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultExplorer-${{ env.APP_VERSION }}-APK
          path: release-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VaultExplorer ${{ github.ref_name }}
          files: release-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove keystore
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/key.properties