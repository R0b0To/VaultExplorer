name: Build & Release

on:
  push:
    tags:
      - 'v*'           # triggers on version tags like v1.0.0
  workflow_dispatch:   # allows manual runs from the Actions tab

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUB_CACHE: /tmp/.pub-cache

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to read the git commit history

      # ── Set SOURCE_DATE_EPOCH to match F-Droid ────────────────────────────
      - name: Set SOURCE_DATE_EPOCH for Reproducible Builds
        run: |
          COMMIT_TIMESTAMP=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP" >> $GITHUB_ENV

      # ── Java ──────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter (PINNED VERSION for Reproducible Builds -- must match
      #    `srclibs: [flutter@X.Y.Z]` in metadata/com.aeidolon.vaultexplorer.yml) ──
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      # ── Node.js (needed by scripts/build_pdfjs.sh, run automatically from
      #    Gradle's preBuild once `flutter build` invokes Gradle) ───────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install dependencies
        run: flutter pub get

      # NOTE: the `jni` pub package's build-id/file-prefix reproducibility
      # patch is no longer applied here as a separate step -- it's now
      # configured directly in android/app/build.gradle.kts via
      # `rootProject.subprojects { ... }`, so it runs automatically as part
      # of Gradle's own configuration phase during "Build release APK"
      # below. See that file for details. scripts/patch_jni_reproducibility.sh
      # is no longer invoked by this workflow.

      # ── Keystore ────────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF


      - name: Pin to single CPU core for R8 determinism
        run: echo "TASKSET=taskset -c 0" >> $GITHUB_ENV


      # ── Build ────────────────────────────────────────────────────────
      # Universal APK (all ABIs in one file) -- matches the single Builds:
      # entry in metadata/com.aeidolon.vaultexplorer.yml so the two are
      # actually comparable for Reproducible Builds verification. Splitting
      # per-ABI is a real feature to add later, not something to do on just
      # one side of this pair without the other.
      - name: Build release APK
        run: ${TASKSET:-} flutter build apk --release

      - name: Verify no build-id in native libs
        run: |
          mkdir -p /tmp/verify
          unzip -q build/app/outputs/flutter-apk/app-release.apk -d /tmp/verify
          fail=0
          for so in /tmp/verify/lib/*/libdartjni.so; do
            if readelf -W -S "$so" | grep -q '\.note\.gnu\.build-id'; then
              echo "::error::$so still has .note.gnu.build-id -- reproducibility patch didn't apply"
              fail=1
            else
              echo "✅ OK: $so is clean (no build-id found)"
            fi
          done
          exit $fail

      # ── Rename with version ───────────────────────────────────────────
      - name: Rename build output
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          SHA=$(git rev-parse --short HEAD)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p release-apk
          cp build/app/outputs/flutter-apk/app-release.apk "release-apk/vaultexplorer-${VERSION}-${SHA}.apk"

      # ── Upload artifact ─────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultExplorer-${{ env.APP_VERSION }}-APK
          path: release-apk/*.apk
          retention-days: 30

      # ── Create GitHub Release ───────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VaultExplorer ${{ github.ref_name }}
          files: release-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Cleanup keystore ────────────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/key.properties