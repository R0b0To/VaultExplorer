name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options:
          - release
          - debug
          - prerelease
        default: release
      publish_debug:
        description: 'Debug only: publish the APKs to the rolling "debug-latest" pre-release'
        type: boolean
        default: true
      prerelease_tag:
        description: 'Pre-release tag (only for prerelease; leave empty to auto-use v<version>-pre)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

env:
  BUILD_DIR: /tmp/build
  JAVA_VERSION: '21'
  # Tag pushes have no inputs, so they always build release.
  BUILD_TYPE: ${{ inputs.build_type || 'release' }}

jobs:
  build:
    name: Build ${{ inputs.build_type || 'release' }} APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: armeabi
            target_platform: android-arm
            offset: 1
          - flavor: x64
            target_platform: android-x64
            offset: 2
          - flavor: arm64
            target_platform: android-arm64
            offset: 3

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android NDK r28c
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Copy checkout to reproducible BUILD_DIR
        run: |
          rm -rf "${{ env.BUILD_DIR }}"
          mkdir -p "$(dirname "${{ env.BUILD_DIR }}")"
          cp -a "$GITHUB_WORKSPACE" "${{ env.BUILD_DIR }}"

      # Used for both release and debug builds, so debug APKs carry the same
      # signature as releases and can be installed over them.
      - name: Set up signing credentials in BUILD_DIR
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Resolve dependencies
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          export PUB_CACHE="${{ env.BUILD_DIR }}/.pub-cache"
          .flutter/bin/flutter config --no-analytics
          .flutter/bin/flutter pub get --enforce-lockfile

      - name: Build APK(s)
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          export PUB_CACHE="${{ env.BUILD_DIR }}/.pub-cache"
          BASE_VERSION_CODE=$(grep '^version:' pubspec.yaml | sed -n 's/.*+\([0-9]*\)/\1/p')
          VERSION_CODE=$(( BASE_VERSION_CODE * 100 + ${{ matrix.offset }} ))

          if [ "${{ env.BUILD_TYPE }}" = "prerelease" ]; then
            MODES=("release" "debug")
          else
            MODES=("${{ env.BUILD_TYPE }}")
          fi

          for MODE in "${MODES[@]}"; do
            echo "Building $MODE APK for ${{ matrix.flavor }}..."
            .flutter/bin/flutter build apk --$MODE \
              --target-platform=${{ matrix.target_platform }} \
              --build-number=$VERSION_CODE
          done

      - name: Prepare APKs for Release
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | cut -d'+' -f1)
          mkdir -p release-apk

          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" \
               "release-apk/VaultExplorer-v${VERSION}-${{ matrix.flavor }}.apk"
          fi

          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-debug.apk" \
               "release-apk/VaultExplorer-v${VERSION}-debug-${{ matrix.flavor }}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultExplorer-${{ matrix.flavor }}-APK
          path: ${{ env.BUILD_DIR }}/release-apk/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.build_type == 'debug' &&
       inputs.publish_debug) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.build_type == 'prerelease')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Metadata & Changelog Path
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | cut -d'+' -f1)
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | cut -d'+' -f2)
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${BUILD_NUMBER}.txt"

          if [ -f "$CHANGELOG_FILE" ]; then
            echo "CHANGELOG_PATH=$CHANGELOG_FILE" >> $GITHUB_ENV
          else
            echo "CHANGELOG_PATH=" >> $GITHUB_ENV
          fi

          if [ "${{ inputs.build_type }}" = "prerelease" ]; then
            TAG="${{ inputs.prerelease_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v${VERSION}-pre"
            fi
            echo "PRERELEASE_TAG=$TAG" >> $GITHUB_ENV
          fi

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-apk
          pattern: VaultExplorer-*-APK
          merge-multiple: true

      # --- 1. Full Production Release (Triggered by git tag push v*) ---
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VaultExplorer ${{ github.ref_name }}
          files: release-apk/*.apk
          body_path: ${{ env.CHANGELOG_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 2. Manual Pre-release with BOTH Release and Debug APKs ---
      - name: Create GitHub Pre-release (Release + Debug)
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'prerelease'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PRERELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: VaultExplorer ${{ env.PRERELEASE_TAG }}
          prerelease: true
          make_latest: false
          body_path: ${{ env.CHANGELOG_PATH }}
          generate_release_notes: true
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 3. Manual Rolling Debug Only Pre-release (debug-latest) ---
      - name: Remove previous debug pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug'
        run: gh release delete debug-latest --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create GitHub Debug Pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          target_commitish: ${{ github.sha }}
          name: VaultExplorer debug build (testing only)
          body: |
            Debug build for testing, not a release.
            Branch: `${{ github.ref_name }}`, commit: `${{ github.sha }}`, run #${{ github.run_number }}.
            Installs next to the release app and is much larger and slower than it.
          prerelease: true
          make_latest: false
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}