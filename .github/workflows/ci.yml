name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  flutter_analyze_and_test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Flutter tags
        run: git -C .flutter fetch --tags

      - name: Add Flutter (submodule) to PATH
        run: echo "$GITHUB_WORKSPACE/.flutter/bin" >> "$GITHUB_PATH"

      - name: flutter --version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  kotlin_unit_tests:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Flutter tags
        run: git -C .flutter fetch --tags

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Flutter (submodule) to PATH
        run: echo "$GITHUB_WORKSPACE/.flutter/bin" >> "$GITHUB_PATH"

      - name: flutter --version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: ./gradlew testDebugUnitTest
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Kotlin test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  native_host_tests:
    name: Native host-side tests (no NDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libarchive (for archive_engine_test)
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev

      - name: Configure (host build)
        run: cmake -S android/app/src/main/cpp -B build-host-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build test binaries
        run: >
          cmake --build build-host-tests -j --target
          sector_batching_test fs_scan_test kdf_table_test decrypted_block_cache_test
          cryfs_block_cipher_test utf16le_password_test container_header_test
          container_utils_crc32_test chunked_block_device_test archive_engine_test

      - name: Run tests (ctest)
        working-directory: build-host-tests
        run: ctest --output-on-failure