name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  flutter_analyze_and_test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  kotlin_unit_tests:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        # The Android module is a Flutter add-to-app style subproject; Gradle
        # invokes it via the Flutter SDK's Gradle plugin, so the toolchain
        # needs to be on PATH even though this job never builds Dart code.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: ./gradlew testDebugUnitTest
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Kotlin test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  native_host_tests:
    name: Native host-side tests (no NDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # These targets are explicitly gated on `if(NOT ANDROID)` in
      # CMakeLists.txt and are written to be free of Android/JNI
      # dependencies (see the "Host-side test, no Android toolchain
      # required" comments in each test file) specifically so pure-logic
      # bugs -- batching math, cache invalidation, KDF table lookups -- can
      # be caught without spinning up an emulator or the NDK cross-compiler.
      # libarchive-dev is needed for archive_engine_test, which is only
      # conditionally defined in CMakeLists.txt (find_package(LibArchive)) --
      # without it the target silently doesn't exist and ctest never misses
      # it. Its earlier failure against this same libarchive turned out to
      # be a stale assertion in archive_engine_test.cpp itself (it expected
      # archiveScanEntries to succeed without a passphrase on an encrypted
      # entry, which contradicts that function's own documented
      # probe-decrypt-on-scan behavior -- see the comment above that probe
      # in archive_engine.cpp), not a libarchive capability gap. Fixed in
      # the same change that adds this step.
      - name: Install libarchive (for archive_engine_test)
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev

      - name: Configure (host build)
        run: cmake -S android/app/src/main/cpp -B build-host-tests -DCMAKE_BUILD_TYPE=Debug

      # Every target named here must match CMakeLists.txt's
      # VAULTEXPLORER_HOST_TESTS list plus archive_engine_test (built
      # separately, above, behind if(LibArchive_FOUND)) -- ctest below runs
      # whatever CMakeLists.txt registered via add_test() regardless of
      # what this step actually compiled, so a target present in one list
      # but missing from the other either builds dead code nothing runs, or
      # (the bug this comment replaces -- this step built only 4 of the 9
      # unconditional targets, and never installed libarchive-dev at all)
      # leaves ctest trying to execute an executable that was never built.
      # cryfs_block_cipher_test, utf16le_password_test, container_header_test,
      # container_utils_crc32_test, chunked_block_device_test and
      # archive_engine_test are added here after confirming each one
      # actually compiles and passes against this repo's current sources.
      # If CMakeLists.txt adds another host test, add it here in the same
      # change.
      - name: Build test binaries
        run: >
          cmake --build build-host-tests -j --target
          sector_batching_test fs_scan_test kdf_table_test decrypted_block_cache_test
          cryfs_block_cipher_test utf16le_password_test container_header_test
          container_utils_crc32_test chunked_block_device_test archive_engine_test

      - name: Run tests (ctest)
        working-directory: build-host-tests
        run: ctest --output-on-failure