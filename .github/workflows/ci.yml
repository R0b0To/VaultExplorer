name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter_analyze_and_test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check code boundaries
        run: python3 scripts/check_code_boundaries.py

      - name: Fetch Flutter tags
        run: git -C .flutter fetch --tags

      - name: Add Flutter (submodule) to PATH
        run: echo "$GITHUB_WORKSPACE/.flutter/bin" >> "$GITHUB_PATH"

      - name: flutter --version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter test
        run: flutter test

  kotlin_unit_tests:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Flutter tags
        run: git -C .flutter fetch --tags

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Flutter (submodule) to PATH
        run: echo "$GITHUB_WORKSPACE/.flutter/bin" >> "$GITHUB_PATH"

      - name: flutter --version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: ./gradlew testDebugUnitTest
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Kotlin test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  native_host_tests:
    name: Native host-side tests (no NDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (host build)
        run: cmake -S android/app/src/main/cpp -B build-host-tests -DCMAKE_BUILD_TYPE=Debug -DLIBGAV1_THREADPOOL_USE_STD_MUTEX=1

      - name: Build test binaries
        run: cmake --build build-host-tests -j --target host_tests

      - name: Run tests (ctest)
        working-directory: build-host-tests
        run: ctest --output-on-failure

  native_ext_backend_tests:
    name: Native ext backend tests (real ext2/3/4 images, e2fsck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and filesystem tools
        run: sudo apt-get update && sudo apt-get install -y g++ git python3 e2fsprogs libssl-dev libmbedtls-dev

      - name: Build and run ext_backend_test
        run: sh android/app/src/main/cpp/filesystems/test/run_ext_backend_test.sh

  native_ntfs_backend_tests:
    name: Native NTFS backend tests (pinned ntfs-3g, app's own mkntfs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and the ntfs-3g utilities used as independent oracles
        run: sudo apt-get update && sudo apt-get install -y g++ git ntfs-3g libssl-dev libmbedtls-dev

      - name: Build and run ntfs_backend_test
        run: sh android/app/src/main/cpp/filesystems/test/run_ntfs_backend_test.sh

  # Desktop (dart:ffi) engine: nothing above builds it, so a change to ffi/, volman/, the shared engines or the
  # desktop host could break Linux/Windows without any job noticing. These are the safety net the plan's
  # Phase 2 (one slot owner in C++) depends on. The Windows app is built by build-desktop.yml (manual); the
  # Windows engine is cross-compiled by desktop_engine_windows_cross below on every change.
  desktop_engine_linux:
    name: Desktop engine (Linux) - build, smoke test, mounts, app build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same package set as build-desktop.yml (Flutter's Linux toolchain, libsecret/jsoncpp for
      # flutter_secure_storage, libmpv for media_kit, libfuse3 so the engine is built WITH OS mounts).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config git perl curl unzip xz-utils zip \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev \
            libmpv-dev mpv libfuse3-dev fuse3 zlib1g-dev nasm

      - name: Build the desktop engine and ve_smoke_test
        run: |
          bash scripts/build_desktop_engine.sh
          if ! grep -q '^VE_FUSE3_INCLUDE_DIR:PATH=/' build/desktop-engine/CMakeCache.txt; then
            echo "::error::libfuse3 headers were not found, so the engine was built without OS mounts"
            exit 1
          fi

      # Black-box test of the exported C ABI on every container filesystem, hidden volumes, password change,
      # folder vaults (gocryptfs / Cryptomator / CryFS), one-shot crypto, hashing and single-file crypto.
      - name: Run ve_smoke_test
        run: build/desktop-engine/ve_smoke_test fat exfat ntfs ext4

      # Native image thumbnails (imaging/thumb.cpp): every format and size, EXIF orientations, alpha, truncated and
      # hostile input, size guards, many threads -- against the pinned libjpeg-turbo / libpng / libwebp builds.
      - name: Build and run thumb_test
        run: |
          cmake --build build/desktop-engine --target thumb_test
          build/desktop-engine/thumb_test

      - name: Build ve_mount_test
        run: cmake --build build/desktop-engine --target ve_mount_test

      # Drives real FUSE mounts. Hosted runners normally expose /dev/fuse, but that is not guaranteed, so a
      # missing device skips the step with a notice instead of failing, and a failure does not block the job
      # until this has been seen green on the runner (then drop continue-on-error).
      - name: Run ve_mount_test (needs /dev/fuse)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          if [ ! -c /dev/fuse ] || ! command -v fusermount3 >/dev/null; then
            echo "::notice::/dev/fuse or fusermount3 unavailable on this runner; skipping the mount test"
            exit 0
          fi
          build/desktop-engine/ve_mount_test

      - name: Fetch Flutter tags
        run: git -C .flutter fetch --tags

      - name: Add Flutter (submodule) to PATH
        run: echo "$GITHUB_WORKSPACE/.flutter/bin" >> "$GITHUB_PATH"

      - name: flutter pub get
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile

      # linux/CMakeLists.txt bundles build/desktop-engine/libvaultexplorer_engine.so, built above.
      - name: flutter build linux (debug)
        run: flutter build linux --debug

  # The desktop engine for 64-bit Windows, cross-compiled with MinGW-w64 (scripts/build_desktop_engine_windows.sh).
  # A build check, not a run: the DLL is compiled and linked, with ve_smoke_test.exe, and its exports and imports
  # are inspected. It catches a POSIX-only call or header creeping into the shared engine, a missing Windows shim,
  # and a regression of the "self-contained, only system DLLs" promise. Running the smoke test needs Windows
  # (or Wine): copy the two files from the build output, or use build-desktop.yml.
  desktop_engine_windows_cross:
    name: Desktop engine (Windows, MinGW-w64 cross-build) - compile and link
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the MinGW-w64 toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git perl curl nasm \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix

      - name: Cross-build the engine DLL and ve_smoke_test.exe
        run: bash scripts/build_desktop_engine_windows.sh

      - name: Inspect the DLL
        run: |
          dll=build/desktop-engine-win/vaultexplorer_engine.dll
          test -s "$dll"
          test -s build/desktop-engine-win/ve_smoke_test.exe
          exports=$(x86_64-w64-mingw32-objdump -p "$dll")
          for symbol in ve_unlock ve_fv_unlock ve_composite_unlock ve_list_directory ve_lock; do
            if ! printf '%s\n' "$exports" | grep -qE "\] $symbol\$"; then
              echo "::error::$dll does not export $symbol"
              exit 1
            fi
          done
          # Self-contained: a MinGW runtime DLL in the import table would have to ship next to the engine.
          if printf '%s\n' "$exports" | grep -iE 'DLL Name: *(libstdc\+\+|libgcc|libwinpthread)'; then
            echo "::error::the engine imports a MinGW runtime DLL; it must link the runtime statically"
            exit 1
          fi
          printf '%s\n' "$exports" | grep 'DLL Name' | sort -u
