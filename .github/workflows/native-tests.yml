name: Native C++ tests

# Builds and runs the host-side (non-Android) native test targets defined in
# cpp/CMakeLists.txt: sector_batching_test, fs_scan_test, kdf_table_test.
#
# These targets already existed but weren't wired into any CI, so they were
# effectively opt-in -- this makes them run on every push/PR that touches
# native code instead. It deliberately builds only the three test targets
# (not the `vaultexplorer` shared library, which needs the Android NDK and
# won't compile on a plain Linux host -- see android/log.h and jni.h
# includes throughout cpp/).
#
# NOTE: this workflow has not been run yet (written and pinned in an
# environment without outbound network access to actually execute it) --
# treat the first run as a shakeout for environment issues (missing apt
# packages for a FetchContent'd dependency's own build requirements, etc.)
# rather than assuming it's green.

on:
  push:
    paths:
      - 'cpp/**'
      - '.github/workflows/native-tests.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - '.github/workflows/native-tests.yml'

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure (host build, test targets only)
        working-directory: cpp
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build test targets
        working-directory: cpp
        run: cmake --build build --target sector_batching_test fs_scan_test kdf_table_test

      - name: Run tests
        working-directory: cpp/build
        run: ctest --output-on-failure
