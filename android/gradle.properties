org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# ── Reproducible Builds: force deterministic dependency ordering ──────────
# Gradle's dependency cache layout (GRADLE_USER_HOME) differs between build
# machines (GitHub Actions runner vs F-Droid build server). Left unpinned,
# that can cause Gradle to hand R8 program-input jars in a different order
# on each machine, which R8 then reflects in its minified class naming --
# this is what caused the Lo/dc1; class-set divergence.
#
# android.enableR8.fullMode is the default on modern AGP but pin it
# explicitly so a future AGP default change can't silently alter R8's
# processing model between the two pipelines.
android.enableR8.fullMode=true

# Disable Gradle's build cache for this project. The build cache stores and
# REUSES task outputs (including R8 outputs) keyed by input hashes -- if the
# two machines have different caches primed (or one is warm and one is cold),
# they can pull previously-cached R8 outputs from unrelated prior runs
# instead of both running R8 fresh against identical current inputs. For
# Reproducible Builds verification specifically, both sides must always
# execute R8 fresh, not serve a cached artifact from a different machine's
# history.
org.gradle.caching=false

# Ensure Gradle doesn't parallelize configuration/execution in a way that
# lets task/input ordering vary run to run.
org.gradle.parallel=false

