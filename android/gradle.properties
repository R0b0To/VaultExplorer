# ── Reproducible Builds: pin R8 worker parallelism ─────────────────────────
# F-Droid's own reproducible-builds documentation identifies CPU-core-count
# differences between build machines as a root cause of R8 assigning
# obfuscated class names differently (e.g. Ly0/j; vs Ly0/i;) even from
# identical source -- R8's internal processing can be parallelized across
# available cores, and that parallel scheduling affects class enumeration
# order. GitHub Actions runners and the F-Droid build server have different
# core counts, so both sides must be pinned to the SAME worker count.
#
# org.gradle.workers.max constrains Gradle's own worker pool, which R8
# (run via the Android Gradle Plugin's R8 task, itself a Gradle worker
# action) inherits from.
org.gradle.workers.max=1


