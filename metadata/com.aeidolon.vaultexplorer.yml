Builds:
  - versionName: 1.0.1
    versionCode: 201
    commit: 1b31f083b5c7c16bcd7aad36c4b457f014034584
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y ca-certificates curl gnupg
      - mkdir -p /etc/apt/keyrings
      - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg
        --dearmor -o /etc/apt/keyrings/nodesource.gpg
      - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_26.x
        nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
      - apt-get update
      - apt-get install -y nodejs
    output: build/app/outputs/flutter-apk/app-arm64-release.apk
    srclibs:
      - flutter@3.44.0
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - cd .. && bash ./scripts/reproducible_build.sh arm64
    binary: https://github.com/R0b0To/VaultExplorer/releases/download/v%v/vaultexplorer-%v-arm64.apk
    ndk: r28

