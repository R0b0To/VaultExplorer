Description: |-
  Vault Explorer opens and browses encrypted disk containers directly on
  your device -- VeraCrypt/TrueCrypt volumes, LUKS, BitLocker, and raw
  VHD/VHDX images -- without exporting your files unencrypted to shared
  storage first.

  Browse the volume's filesystem (NTFS, FAT, ext2/3/4), preview photos,
  video, and PDFs from inside it, and extract only what you need. All
  decryption happens on-device; nothing is uploaded anywhere.

AntiFeatures: {}

RepoType: git
Repo: https://github.com/R0b0To/VaultExplorer.git

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    ndk: r26d

    sudo:
      - mkdir -p /home/runner/work/VaultExplorer
      - chown vagrant /home/runner/work/VaultExplorer

    srclibs:
      - flutter@3.44.0

    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    prebuild:
      - export repo=/home/runner/work/VaultExplorer/VaultExplorer
      - mkdir -p $repo
      - cd ..
      - mv VaultExplorer $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get

    build:
      - export repo=/home/runner/work/VaultExplorer/VaultExplorer
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"

AutoUpdateMode: Version
UpdateCheckMode: Tags
