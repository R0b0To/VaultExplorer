Builds:
  - versionName: 1.7.0
    versionCode: 1001
    commit: fda7c1e07fb6169011301c327620e1a557ae3916
    output: build/app/outputs/flutter-apk/app-release.apk
    binary: https://github.com/R0b0To/VaultExplorer/releases/download/v%v/VaultExplorer-v%v-armeabi.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/build-release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - $$flutter$$/packages/flutter_tools/gradle/flutter.gradle
      - $$flutter$$/bin/cache
    scandelete:
      - $$flutter$$
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export VAULTEXPLORER_TARGET_ABI="armeabi-v7a"
      - $$flutter$$/bin/flutter build apk --release --target-platform=android-arm --build-number=1001
    ndk: r28c

