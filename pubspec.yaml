name: vaultexplorer
description: "A new Flutter project."
publish_to: 'none'
version: 0.99.33+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  video_player: ^2.13.0
  local_auth: ^3.0.2
  pointycastle: ^3.6.2
  flutter_secure_storage: 10.3.1
  encrypt: ^5.0.3
  url_launcher:  ^6.3.2
  wakelock_plus: ^1.5.2
  package_info_plus: ^10.2.1
  vector_math: ^2.1.4
  archive: ^4.0.4      
  path: ^1.9.0
  sensors_plus: ^7.1.0
  flutter_staggered_grid_view: ^0.7.0
  pdfrx: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 
  test: ^1.31.0
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF" # Background color or path to a background image
  adaptive_icon_foreground: "assets/images/app_icon.png"