name: vaultexplorer
description: "Encrypted container explorer: VeraCrypt, LUKS, BitLocker, and more."
publish_to: 'none'
version: 1.5.0+8
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  archive: ^4.0.9
  path: ^1.9.1
  flutter_staggered_grid_view: ^0.7.0
  dynamic_color: ^1.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  test: ^1.31.0
  fake_async: ^1.3.1
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/app_icon.png
    - assets/data/eff_large_wordlist.txt
flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"