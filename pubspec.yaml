name: vaultexplorer
description: "Encrypted container explorer: VeraCrypt, LUKS, BitLocker, and more."
publish_to: 'none'
version: 1.13.1+20
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  archive: ^4.0.9
  path: ^1.9.1
  flutter_staggered_grid_view: ^0.7.0
  dynamic_color: ^2.1.0
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  material_ui: ^1.1.0
  meta: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  test: ^1.31.0
  fake_async: ^1.3.1
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8
  path_provider_platform_interface: any
  plugin_platform_interface: any
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/app_icon.png
    - assets/data/eff_large_wordlist.txt
flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  adaptive_icon_monochrome: "assets/images/app_icon_monochrome.png"